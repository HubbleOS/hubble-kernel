name: Discord Commit Notify

on:
  push:
    branches:
      - "**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send commit info to Discord
        uses: Ilshidur/action-discord@v3
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          message: |
            **New commit by:** `${{ github.actor }}`
            **Branch:** `${{ github.ref }}`
            **Message:** ${{ github.event.head_commit.message }}
            **Diff:** ${{ github.event.compare }}
