# Minimal Limine configuration for kernel development
timeout: 0

# Kernel command line: add "    cmdline: init=/path" to the entry below,
# or set CMDLINE when building the ISO (build-minimal-iso.sh).

/Hubble Kernel
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    module_path: boot():/boot/initramfs.img
